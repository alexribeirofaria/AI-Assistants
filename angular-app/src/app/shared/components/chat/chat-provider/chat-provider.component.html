<div class="chat-provider-container">
  <label for="provider-select" class="form-label">Provider</label>
  <select id="provider-select" class="form-select" 
    [ngModel]="selectedProvider" 
    (ngModelChange)="onProviderSelected($event)">
    <option value="" disabled>Selecione um provider</option>
    @for (provider of providers; track provider) {
      <option [value]="provider">{{ capitalizeProvider(provider) }}</option>
    }
  </select>
</div>

<div class="chat-list-models-container">
  <label for="model-select" class="form-label">Modelo</label>
  <select id="model-select" class="form-select" 
    [ngModel]="selectedModel" 
    (ngModelChange)="onModelSelected($event)"
    [disabled]="models.length === 0">
    <option value="" disabled>{{ placeholderText }}</option>
    @for (model of models; track model.id) {
      <option [value]="model.id">{{ model.modelName || model.id }}</option>
    }
  </select>
</div>
